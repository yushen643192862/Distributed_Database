x-datanode-common: &datanode-common
  build:
    context: ./datanode
  image: distributed-minisql-datanode:local
  environment:
    MINISQL_MASTER_URL: http://master:8080
    MINISQL_JDBC_USER: ddb_user
    MINISQL_JDBC_PASSWORD: db_1234567

services:
  mysql:
    image: mysql:8.4
    container_name: minisql-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_1234567
      MYSQL_DATABASE: ddb
      MYSQL_USER: ddb_user
      MYSQL_PASSWORD: db_1234567
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_1234567"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: minisql-postgres
    environment:
      POSTGRES_DB: ddb
      POSTGRES_USER: ddb_user
      POSTGRES_PASSWORD: db_1234567
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddb_user -d ddb"]
      interval: 5s
      timeout: 5s
      retries: 20

  master:
    build:
      context: .
    image: distributed-minisql-master:local
    container_name: minisql-master
    environment:
      MINISQL_SERVER_MODE: "true"
      MINISQL_MASTER_PORT: 8080
      MINISQL_PRIMARY_COUNT: 5
      MINISQL_HEARTBEAT_TIMEOUT_MS: 5000
      MINISQL_DATA: /app/data/minisql-state.bin
    ports:
      - "8080:8080"
    volumes:
      - master-data:/app/data

  web:
    build:
      context: ./web-query
    image: distributed-minisql-web:local
    container_name: minisql-web
    depends_on:
      master:
        condition: service_started
    ports:
      - "5173:80"

  dn1:
    <<: *datanode-common
    container_name: minisql-dn1
    depends_on:
      master:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      MINISQL_MASTER_URL: http://master:8080
      MINISQL_NODE_ID: dn1
      MINISQL_NODE_HOST: dn1
      MINISQL_NODE_PORT: 9101
      MINISQL_NODE_ROLE: PRIMARY
      MINISQL_DATABASE_TYPE: MYSQL
      MINISQL_JDBC_URL: jdbc:mysql://mysql:3306/minisql_dn1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MINISQL_JDBC_USER: ddb_user
      MINISQL_JDBC_PASSWORD: db_1234567
      MINISQL_JDBC_DRIVER: com.mysql.cj.jdbc.Driver

  dn2:
    <<: *datanode-common
    container_name: minisql-dn2
    depends_on:
      master:
        condition: service_started
      postgres:
        condition: service_healthy
      dn1:
        condition: service_started
    environment:
      MINISQL_MASTER_URL: http://master:8080
      MINISQL_NODE_ID: dn2
      MINISQL_NODE_HOST: dn2
      MINISQL_NODE_PORT: 9101
      MINISQL_NODE_ROLE: REPLICA
      MINISQL_DATABASE_TYPE: POSTGRESQL
      MINISQL_JDBC_URL: jdbc:postgresql://postgres:5432/minisql_dn2
      MINISQL_JDBC_USER: ddb_user
      MINISQL_JDBC_PASSWORD: db_1234567
      MINISQL_JDBC_DRIVER: org.postgresql.Driver

  dn3:
