services:
  master:
    build:
      context: ./Distributed_Database
    image: distributed-minisql-master:local
    container_name: minisql-master
    environment:
      MINISQL_DATA: /app/data/minisql-state.bin
      MINISQL_MASTER_PORT: 8080
      MINISQL_SERVER_MODE: "true"
    ports:
      - "8080:8080"
    volumes:
      - master-data:/app/data

  dn1:
    build:
      context: ./datanode
    image: distributed-minisql-datanode:local
    container_name: minisql-dn1
    depends_on:
      - master
    environment:
      MINISQL_NODE_ID: dn1
      MINISQL_NODE_HOST: dn1
      MINISQL_NODE_PORT: 9101
      MINISQL_MASTER_URL: http://master:8080
      MINISQL_DATABASE_TYPE: H2
      MINISQL_JDBC_URL: jdbc:h2:/app/data/dn1
    ports:
      - "9101:9101"
    volumes:
      - dn1-data:/app/data

  dn2:
    build:
      context: ./datanode
    image: distributed-minisql-datanode:local
    container_name: minisql-dn2
    depends_on:
      - master
    environment:
      MINISQL_NODE_ID: dn2
      MINISQL_NODE_HOST: dn2
      MINISQL_NODE_PORT: 9101
      MINISQL_MASTER_URL: http://master:8080
      MINISQL_DATABASE_TYPE: H2
      MINISQL_JDBC_URL: jdbc:h2:/app/data/dn2
    ports:
      - "9102:9101"
    volumes:
      - dn2-data:/app/data

  dn3:
    build:
      context: ./datanode
    image: distributed-minisql-datanode:local
    container_name: minisql-dn3
    depends_on:
      - master
    environment:
      MINISQL_NODE_ID: dn3
      MINISQL_NODE_HOST: dn3
      MINISQL_NODE_PORT: 9101
      MINISQL_MASTER_URL: http://master:8080
      MINISQL_DATABASE_TYPE: H2
      MINISQL_JDBC_URL: jdbc:h2:/app/data/dn3
    ports:
      - "9103:9101"
    volumes:
      - dn3-data:/app/data

volumes:
  master-data:
  dn1-data:
  dn2-data:
  dn3-data:
